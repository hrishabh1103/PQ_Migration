server {
    listen 8444 ssl;
    server_name lab-ecdsa-tls.local localhost;

    ssl_certificate /etc/nginx/certs/lab_ecdsa_cert.pem;
    ssl_certificate_key /etc/nginx/certs/lab_ecdsa_cert.key;

    ssl_protocols TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384;
    ssl_ecdh_curve prime256v1;
    ssl_prefer_server_ciphers on;

    location / {
        return 200 'ECDSA TLS 1.3 Active';
        add_header Content-Type text/plain;
    }
}

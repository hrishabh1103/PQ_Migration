worker_processes 1;
events { worker_connections 1024; }

http {
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 4433 ssl;
        server_name lab-negative-hybrid-tls.local localhost;

        ssl_certificate /opt/nginx/certs/lab_cert.pem;
        ssl_certificate_key /opt/nginx/certs/lab_cert.key;

        ssl_protocols TLSv1.3;
        ssl_ecdh_curve x25519_mlkem768:X25519:prime256v1;

        location / {
            return 200 'Negative Hybrid TLS Configured\n';
            add_header Content-Type text/plain;
        }
    }
}

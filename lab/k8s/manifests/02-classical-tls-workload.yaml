apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-classical-workload
  namespace: lab-crypto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-classical-workload
  template:
    metadata:
      labels:
        app: lab-classical-workload
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-classical-service
  namespace: lab-crypto
spec:
  type: ClusterIP
  selector:
    app: lab-classical-workload
  ports:
    - port: 443
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab-classical-ingress
  namespace: lab-crypto
spec:
  tls:
    - hosts:
        - lab-k8s.local
      secretName: lab-k8s-tls-secret
  rules:
    - host: lab-k8s.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab-classical-service
                port:
                  number: 443
